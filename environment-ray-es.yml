name: stackelberg-pomdp-ray-es
channels:
  - defaults
dependencies:
  - python=3.9
  - pip=23.3
  - setuptools=65
  - wheel=0.37.1
  - pip:
      # Dedicated matrix-ES environment.  Ray is intentionally absent from
      # the main environment.yml.
      - ray[rllib]==2.0.1
      - numpy==1.23.0
      - cloudpickle==1.6.0
      - gym==0.21.0
      - torch==2.0.0
      - stable-baselines3==1.8.0
      - importlib-metadata==4.13.0
      - protobuf==3.20.3
      - pandas==2.2.2
      - matplotlib==3.7.1
      - wandb==0.15.12
variables:
  PYTHONNOUSERSITE: "1"
